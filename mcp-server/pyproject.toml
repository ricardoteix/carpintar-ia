[project]
name = "carpintaria-mcp-server"
version = "0.1.0"
description = "MCP Server para consulta de catálogo, preços e kits de marcenaria (Leo Madeiras)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
carpintaria-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
